name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The SDK global.json pins, plus the .NET 10 runtime the net10.0 tests run on.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts

      # The package must carry the README and icon nuget.org shows, the source generator, and the
      # target that adds it to projects referencing the package indirectly if the SDK hasn't.
      - name: Package contents
        run: |
          test "$(ls ./artifacts/*.nupkg | wc -l)" -eq 1
          package="$(ls ./artifacts/Hlibz.UseCases.[0-9]*.nupkg)"
          unzip -l "$package" > contents.txt
          grep -qE " README\.md$" contents.txt
          grep -qE " icon\.png$" contents.txt
          grep -qE " analyzers/dotnet/cs/Hlibz\.UseCases\.Generators\.dll$" contents.txt
          grep -qE " buildTransitive/Hlibz\.UseCases\.targets$" contents.txt
          unzip -p "$package" '*.nuspec' > package.nuspec
          grep -q "<readme>README.md</readme>" package.nuspec
          grep -q "<icon>icon.png</icon>" package.nuspec

      # A project that gets the package only indirectly compiles with the packed generator.
      - name: Packed generator
        run: .github/scripts/check-packed-generator.sh ./artifacts
